<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0A0A0D;color:#F5F5F7;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(520px 380px at 50% 112%, rgba(101,83,240,.55), transparent 70%),
  radial-gradient(700px 420px at 50% 120%, rgba(125,112,243,.22), transparent 72%),
  radial-gradient(420px 300px at 88% -12%, rgba(125,112,243,.20), transparent 70%),
  radial-gradient(360px 260px at 6% -10%, rgba(101,83,240,.14), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;
  -webkit-mask-image:radial-gradient(70% 80% at 50% 45%, #000 20%, transparent 75%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:14px}
.icon{width:148px;height:148px;filter:drop-shadow(0 18px 40px rgba(101,83,240,.55))}
h1{font-size:96px;font-weight:600;letter-spacing:-3.6px;line-height:1;margin-top:26px}
p{font-size:30px;color:#A9A9B4;margin-top:16px;letter-spacing:-.3px}
.row{display:flex;gap:12px;margin-top:34px}
.pill{font-size:19px;font-weight:500;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#D6D6DE}
.pill b{color:#A99FFF;font-weight:600}
</style>
<div class="glow"></div><div class="grid"></div>
<div class="c">
  <img class="icon" src="../launch-video/assets/icon.png">
  <h1>Scout</h1>
  <p>The fastest way around your Mac.</p>
  <div class="row"><span class="pill"><b>Free</b> &amp; open source</span><span class="pill">macOS 26+</span><span class="pill">⌥ Space to jump anywhere</span></div>
</div>
